name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure Apps Script endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VITE_APPS_SCRIPT_URL:-}" ] && [ -f .env.production ]; then
            VITE_APPS_SCRIPT_URL="$(sed -n 's/^VITE_APPS_SCRIPT_URL=//p' .env.production | head -1)"
            echo "VITE_APPS_SCRIPT_URL=$VITE_APPS_SCRIPT_URL" >> "$GITHUB_ENV"
          fi
          if [ -z "${VITE_APPS_SCRIPT_URL:-}" ]; then
            echo "VITE_APPS_SCRIPT_URL is not configured."
            exit 1
          fi
          case "$VITE_APPS_SCRIPT_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo "VITE_APPS_SCRIPT_URL must be a Google Apps Script /exec URL."; exit 1 ;;
          esac
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Prepare Pages
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dist/client/index.html ]; then
            PUBLISH_DIR=dist/client
          elif [ -f dist/client/_shell.html ]; then
            PUBLISH_DIR=dist/client
            cp dist/client/_shell.html dist/client/index.html
          else
            echo 'No static entry file found. Build output:'
            find dist -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          touch "$PUBLISH_DIR/.nojekyll"
          cp "$PUBLISH_DIR/index.html" "$PUBLISH_DIR/404.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
