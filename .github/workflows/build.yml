name: Frontend Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Apps Script configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VITE_APPS_SCRIPT_URL:-}" ]; then
            echo "VITE_APPS_SCRIPT_URL is not configured as a GitHub repository variable."
            echo "Add the deployed Google Apps Script Web App /exec URL as repository variable VITE_APPS_SCRIPT_URL."
            exit 1
          fi
          case "$VITE_APPS_SCRIPT_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *)
              echo "VITE_APPS_SCRIPT_URL must be a Google Apps Script /exec URL."
              exit 1
              ;;
          esac
      - name: Build application
        run: pnpm build
